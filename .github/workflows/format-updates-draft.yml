name: Format Updates Draft Branch

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/community-updates-nested-layout-20261009' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only modified TypeScript
        run: pnpm exec prettier --write src/modules/game-servers/card-profile.ts src/modules/game-servers/renderer.ts tests/unit/http/game-server-routes.test.ts tests/unit/modules/game-servers/card-profile.test.ts tests/unit/modules/game-servers/renderer.test.ts
      - name: Commit formatter-only changes to this draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/game-servers/card-profile.ts src/modules/game-servers/renderer.ts tests/unit/http/game-server-routes.test.ts tests/unit/modules/game-servers/card-profile.test.ts tests/unit/modules/game-servers/renderer.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(updates): apply Prettier to nested updates implementation"
            git push origin HEAD:feat/community-updates-nested-layout-20261009
          fi
