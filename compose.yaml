services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tenman
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tenman']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    env_file: ${ENV_FILE:-.env}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres-data:
