services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tenman
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tenman']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: runtime
    env_file: ${ENV_FILE:-.env}
    # The host uses systemd-resolved's loopback stub (127.0.0.53), which is
    # unreachable from this container. Use the verified LAN resolver directly
    # so Discord gateway DNS remains available after an app recreation.
    dns:
      - 192.168.1.1
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # Explicitly run this one-off service for database migrations and seeding.
  # It retains only the development tooling that those operations require;
  # the long-running app image stays production-pruned.
  db-tools:
    build:
      context: .
      target: db-tools
    env_file: ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [tools]

volumes:
  postgres-data:
